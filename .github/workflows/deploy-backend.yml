name: CI/CD casino-backend

on:
  push:
    branches: [deploy]
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login a ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build tag y push (API)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo '1.0.0')
          IMAGE=$REGISTRY/casino-backend
          docker build -t $IMAGE:v$VERSION -t $IMAGE:latest -t $IMAGE:$TAG .
          docker push $IMAGE:v$VERSION
          docker push $IMAGE:latest
          docker push $IMAGE:$TAG

      # Nuevo: construye y sube la imagen de Postgres (db/Dockerfile + init.sql).
      # Antes nadie la construía y el repo casino-db en ECR quedaba vacío,
      # provocando ImagePullBackOff/ErrImagePull en el deployment de postgres.
      - name: Build tag y push (DB)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          IMAGE=$REGISTRY/casino-db
          docker build -t $IMAGE:latest -t $IMAGE:$TAG ./db
          docker push $IMAGE:latest
          docker push $IMAGE:$TAG

      - name: Deploy en EKS
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          aws eks update-kubeconfig --name vidal-casino --region us-east-1
          kubectl apply -f k8s/
          kubectl set image deployment/casino-backend casino-backend=$REGISTRY/casino-backend:$TAG
          kubectl set image deployment/postgres postgres=$REGISTRY/casino-db:$TAG
          kubectl rollout status deployment/casino-backend
          kubectl rollout status deployment/postgres