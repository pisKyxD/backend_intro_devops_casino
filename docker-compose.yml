version: '3.9'

services:

  db:
    image: postgres:16-alpine
    container_name: casino-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: casino
      POSTGRES_PASSWORD: casino
      POSTGRES_DB: casino_db
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casino -d casino_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casino-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: casino
      DB_PASSWORD: casino
      DB_NAME: casino_db
      JWT_SECRET: dev_secret_local
      CORS_ORIGIN: "*"
      PORT: 3000
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ../frontend_intro_devops_casino
      dockerfile: Dockerfile
    container_name: casino-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_HOST: backend
    ports:
      - "8080:8080"

volumes:
  pg_data:
    name: casino_pg_data