apiVersion: apps/v1
kind: Deployment
metadata:
  name: casino-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: casino-backend
  template:
    metadata:
      labels:
        app: casino-backend
    spec:
      containers:
        - name: casino-backend
          image: 465742243019.dkr.ecr.us-east-1.amazonaws.com/casino-backend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: casino-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # startupProbe: le da a la app hasta 30 x 5s = 150s para terminar de
          # conectar a Postgres (esperarBD) antes de que el liveness la mate.
          # Mientras el startupProbe no pase, el livenessProbe NO se ejecuta.
          startupProbe:
            httpGet:
              path: /livez
              port: 3000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 3000
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: casino-backend
spec:
  selector:
    app: casino-backend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP